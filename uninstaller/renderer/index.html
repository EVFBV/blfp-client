<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>卸载 BLFP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="brand-panel">
      <div class="logo">BLFP</div>
      <h1>卸载 BLFP</h1>
      <p>安全移除客户端、快捷方式与安装目录。</p>
      <div class="dots"><span></span><span></span><span></span></div>
    </aside>
    <main class="content-panel">
      <section class="step active">
        <div class="step-icon danger-icon">!</div>
        <h2>确认卸载</h2>
        <p id="message" class="desc">这将移除 BLFP 主程序和快捷方式。确认继续吗？</p>
        <div id="install-dir" class="path-card">正在定位安装目录...</div>
        <div id="progress" class="progress-wrap hidden">
          <div class="spinner"></div>
          <span>正在关闭 BLFP 并准备删除文件...</span>
        </div>
        <div id="actions" class="actions">
          <button id="cancel" class="btn secondary">取消</button>
          <button id="uninstall" class="btn danger">确认卸载</button>
        </div>
        <div id="done-actions" class="actions hidden">
          <button id="finish" class="btn primary">完成并删除残留</button>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
