name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 20

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Extract version
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          npm ci
          cd uninstaller && npm ci && cd ..
          cd installer && npm ci && cd ..

      - name: Build uninstaller
        run: cd uninstaller && npm run dist -- --publish never

      - name: Build client directory
        run: npm run dist -- --publish never

      - name: Verify client build (关键文件校验)
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.v }}"
          $root = Join-Path "build_v$ver" "win-unpacked"
          $required = @(
            (Join-Path $root "BLFP.exe"),
            (Join-Path $root "resources\bin\easytier-core.exe"),
            (Join-Path $root "resources\bin\easytier-cli.exe"),
            (Join-Path $root "resources\bin\frpc.exe"),
            (Join-Path $root "resources\bin\wintun.dll"),
            (Join-Path $root "resources\app\renderer\index.html"),
            (Join-Path $root "resources\app\renderer\app.js"),
            (Join-Path $root "resources\app\main.js")
          )
          $missing = @()
          foreach ($f in $required) { if (-not (Test-Path $f)) { $missing += $f } }
          if ($missing.Count -gt 0) {
            Write-Host "客户端构建缺少以下文件："
            $missing | ForEach-Object { Write-Host "   $_" }
            throw "客户端构建不完整，已中止（避免产出装不起来的安装包）"
          }
          Write-Host "客户端构建校验通过（主程序 + 运行文件 + 渲染层）"
          $binSize = (Get-ChildItem (Join-Path $root "resources\bin") | Measure-Object -Property Length -Sum).Sum
          Write-Host "   bin 目录总大小: $([math]::Round($binSize/1MB,1)) MB"

      - name: Assemble payload
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.v }}"
          $clientOutput = Join-Path "build_v$ver" "win-unpacked"
          $payloadDir = Join-Path "installer" "payload"
          if (Test-Path $payloadDir) { Remove-Item -Recurse -Force $payloadDir }
          New-Item -ItemType Directory -Path $payloadDir -Force | Out-Null
          Compress-Archive -Path "$clientOutput/*" -DestinationPath (Join-Path $payloadDir "payload.zip") -Force
          $uninstallerExe = Join-Path (Join-Path "uninstaller" "out_v$ver") "BLFP-Uninstall.exe"
          if (-not (Test-Path $uninstallerExe)) { throw "卸载程序未生成: $uninstallerExe" }
          Copy-Item -Path $uninstallerExe -Destination (Join-Path $payloadDir "BLFP-Uninstaller.exe") -Force
          $uninstallerExe2 = $uninstallerExe
          # 显式校验 payload.zip（此前只打印一个坏掉的计数，缺失不会失败）
          $zip = Join-Path $payloadDir "payload.zip"
          if (-not (Test-Path $zip)) { throw "payload.zip 未生成！" }
          $zipMB = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          if ($zipMB -lt 80) { throw "payload.zip 体积异常（$zipMB MB），客户端构建可能不完整" }
          Write-Host "payload 组装完成：payload.zip = $zipMB MB"
          Get-ChildItem $payloadDir | ForEach-Object { Write-Host ("   " + $_.Name + "  " + [math]::Round($_.Length/1MB,2) + " MB") }

      - name: Build installer
        run: cd installer && npm run dist -- --publish never

      - name: Verify installer (安装包完整性校验)
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.v }}"
          $exe = "installer\out_v$ver-final\BLFP-Setup-v$ver.exe"
          if (-not (Test-Path $exe)) { throw "安装包未生成: $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "安装包大小: $mb MB"
          if ($mb -lt 150) { throw "安装包体积异常（$mb MB）——很可能没打进 payload.zip" }
          Write-Host "安装包校验通过（含内置客户端数据）"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/out_v${{ steps.ver.outputs.v }}-final/BLFP-Setup-v${{ steps.ver.outputs.v }}.exe
          generate_release_notes: true
