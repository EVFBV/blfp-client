name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 20

jobs:
  release:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 是必须的：默认只拉 1 个提交（浅克隆），
      # 而"生成更新日志"要遍历提交历史算区间 —— 浅克隆里连 HEAD 的父提交都不存在，
      # git describe <tag>^ 会 fatal，区间算空，发布直接失败（踩过）。
      # fetch-tags 一并打开，否则可达的旧 tag 看不见，同样算不出区间。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Extract version
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF#refs/tags/v}"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          # tag 必须和 package.json 的版本一致。
          # electron-builder 按 package.json 的版本命名产物目录（build_v<版本>），
          # 打错 tag 时下游只会报"产物目录不存在"，完全看不出真正原因（踩过）。
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$v" ]; then
            echo "::error::tag 是 v$v，但 package.json 是 $pkg —— 先把 package.json 的版本改成 $v 再打 tag"
            exit 1
          fi
          echo "✓ tag 与 package.json 版本一致：$v"

      - name: Write build info
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          printf 'window.__BLFP_BUILD__ = { sha: "%s", builtAt: "%s" };\n' "$SHA" "$DATE" > renderer/build-info.js
          cat renderer/build-info.js

      - name: Install dependencies
        run: |
          npm ci
          cd uninstaller && npm ci && cd ..
          cd installer && npm ci && cd ..

      # 先跑测试再打包：宁可不发版，也不要发一个"秒关秒装"其实没生效的安装器。
      # 安装器那 42 项测试专门盯着用户抱怨过的几个点（静默模式不能建窗口、
      # 快路径只等 4 秒、不允许 120 秒等待、必须跳过未变化文件）。
      - name: Run tests
        run: |
          npm test
          cd installer && npm test && cd ..

      - name: Strip dev-only files
        shell: bash
        run: |
          # 布局调试器只用于开发期微调：正式版必须剔除，PRE 版必须保留。
          #
          # 这里只做"把工作区恢复成正式版"的粗清理，真正按版本号决定去留的是
          # scripts/prepare-release.js —— 它挂在 npm run dist 前面，会：
          #   PRE  → 从 git 把 6 个调试器文件取回来并插回 index.html 引用
          #   正式 → 删掉全部 6 个文件并清掉 index.html 引用，然后断言无残留
          # 两处都以同一个文件清单为准，避免新增调试器文件后漏掉某个。
          TUNER_FILES=(
            renderer/layout-tuner.js
            renderer/layout-tuner.css
            renderer/layout-tuner-shared.js
            renderer/layout-tuner-window.html
            renderer/layout-tuner-window.css
            renderer/layout-tuner-window.js
          )
          for f in "${TUNER_FILES[@]}"; do rm -f "$f"; done
          sed -i '/layout-tuner/d' renderer/index.html
          if grep -rn 'layout-tuner' renderer/ ; then
            echo '::error::布局调试器未被完全剔除，发布版不应包含它'
            exit 1
          fi
          echo '已剔除布局调试器（PRE 版本稍后由 prepare-release.js 按版本号恢复）'

      - name: Build uninstaller
        run: cd uninstaller && npm run dist -- --publish never

      - name: Build client directory
        run: npm run dist -- --publish never

      - name: Verify client build
        shell: bash
        run: |
          # 校验逻辑放在 scripts/verify-build.js 里，不用 PowerShell：
          # PowerShell 内联脚本含中文时，Windows PowerShell 5.1 会按 ANSI 解码无 BOM 的脚本，
          # 中文变乱码导致步骤失败且看不出原因；Node 没有这个问题，本地也能直接跑。
          VER="${{ steps.ver.outputs.v }}"
          node scripts/verify-build.js "build_v$VER/win-unpacked" "$VER"

      - name: Assemble payload
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.v }}"
          $clientOutput = Join-Path "build_v$ver" "win-unpacked"
          $payloadDir = Join-Path "installer" "payload"
          if (Test-Path $payloadDir) { Remove-Item -Recurse -Force $payloadDir }
          New-Item -ItemType Directory -Path $payloadDir -Force | Out-Null
          Compress-Archive -Path "$clientOutput/*" -DestinationPath (Join-Path $payloadDir "payload.zip") -Force
          $uninstallerExe = Join-Path (Join-Path "uninstaller" "out_v$ver") "BLFP-Uninstall.exe"
          if (-not (Test-Path $uninstallerExe)) { throw "uninstaller exe not found: $uninstallerExe" }
          Copy-Item -Path $uninstallerExe -Destination (Join-Path $payloadDir "BLFP-Uninstaller.exe") -Force
          $zip = Join-Path $payloadDir "payload.zip"
          if (-not (Test-Path $zip)) { throw "payload.zip was not created" }
          $zipMB = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          if ($zipMB -lt 80) { throw "payload.zip too small: $zipMB MB" }
          Write-Host ("OK - payload assembled: payload.zip = " + $zipMB + " MB")
          Get-ChildItem $payloadDir | ForEach-Object { Write-Host ("   " + $_.Name + "  " + [math]::Round($_.Length/1MB,2) + " MB") }

      - name: Build installer
        run: cd installer && npm run dist -- --publish never

      - name: Verify installer
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.v }}"
          $exe = "installer\out_v$ver-final\BLFP-Setup-v$ver.exe"
          if (-not (Test-Path $exe)) { throw "installer not found: $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host ("installer size: " + $mb + " MB")
          if ($mb -lt 150) { throw "installer too small ($mb MB) - payload probably missing" }
          Write-Host "OK - installer verified"

      # 体积检查发现不了"文件没打进包"：exe 照样 250MB，但用户点更新就炸。
      # 所以直接翻开 app.asar 看隐藏触发接口在不在（asar 不压缩，可以当文本查）。
      - name: Verify packed installer contents
        shell: bash
        run: node installer/verify-packed.js "installer/out_v${{ steps.ver.outputs.v }}-final"

      - name: Generate release notes
        shell: bash
        run: |
          # 从真实提交生成更新日志；区间由 changelog.js 自动取 HEAD 可达的最近 tag。
          # 生成失败（比如算不出区间）就直接终止发布 —— 宁可不出包，
          # 也不要发一个更新日志和实际改动对不上的版本。
          node scripts/changelog.js --with-build --sha "${{ github.sha }}" --out CHANGELOG_RELEASE.md
          echo '----- 发布说明预览 -----'
          head -40 CHANGELOG_RELEASE.md
          echo '------------------------'
          if [ ! -s CHANGELOG_RELEASE.md ]; then
            echo '::error::发布说明为空，拒绝发布'
            exit 1
          fi

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: installer/out_v${{ steps.ver.outputs.v }}-final/BLFP-Setup-v${{ steps.ver.outputs.v }}.exe
          # tag 名含 '-'（如 v2.3.1-pre）一律标为预发布，避免被 /releases/latest 返回而推送给正式用户
          prerelease: ${{ contains(steps.ver.outputs.v, '-') }}
          # 更新日志由 scripts/changelog.js 从真实提交里生成，不再硬编码。
          # 之前这里写死了 v2.3.3 时期的说明，之后每次发版都原样贴出去，
          # 用户看到的日志和实际改动对不上。
          body_path: CHANGELOG_RELEASE.md