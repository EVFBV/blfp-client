name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 20

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Extract version
        id: ver
        run: echo "v=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install & build
        run: |
          npm ci
          npm run dist -- --publish never
          cd installer && npm ci && npm run dist -- --publish never
        env:
          VERSION: ${{ steps.ver.outputs.v }}

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/out_v${{ steps.ver.outputs.v }}-final/BLFP-Setup-${{ steps.ver.outputs.v }}.exe
          generate_release_notes: true
