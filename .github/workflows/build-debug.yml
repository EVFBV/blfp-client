name: Build Debug (含布局调试器)

# 手动触发。两个用途：
#   1) 填 label + 留空 tag → 发到固定 debug-tuner 标签（老用法）
#   2) 填 tag（如 v2.3.3-pre）→ 发布为版本化 pre-release，供「测试版」更新渠道拉取
# 正式发布仍走 release.yml（那边打包前剔除调试器）。
on:
  workflow_dispatch:
    inputs:
      label:
        description: 产物名后缀
        required: false
        default: tuner
      tag:
        description: 填写则发布为该 tag 的 pre-release（如 v2.3.3-pre）；留空发到 debug-tuner
        required: false

permissions:
  contents: write

env:
  NODE_VERSION: 20

jobs:
  debug-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve tag
        id: reltag
        shell: bash
        run: |
          T=${{ github.event.inputs.tag }}
          if [ -z "$T" ]; then T=debug-tuner; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Write build info
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          printf 'window.__BLFP_BUILD__ = { sha: "%s", builtAt: "%s", debug: true };\n' "$SHA" "$DATE" > renderer/build-info.js
          cat renderer/build-info.js

      - name: Assert layout tuner is present
        shell: bash
        run: |
          test -f renderer/layout-tuner.js || { echo '::error::布局调试器缺失'; exit 1; }
          test -f renderer/layout-tuner.css || { echo '::error::布局调试器样式缺失'; exit 1; }
          grep -q 'layout-tuner' renderer/index.html || { echo '::error::index.html 未引用布局调试器'; exit 1; }
          echo '布局调试器存在，继续构建'

      - name: Install dependencies
        run: |
          npm ci
          cd uninstaller && npm ci && cd ..
          cd installer && npm ci && cd ..

      - name: Build uninstaller
        run: cd uninstaller && npm run dist -- --publish never

      - name: Build client directory
        run: npm run dist -- --publish never

      - name: Assemble payload
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.v }}"
          $clientOutput = Join-Path "build_v$ver" "win-unpacked"
          $payloadDir = Join-Path "installer" "payload"
          if (Test-Path $payloadDir) { Remove-Item -Recurse -Force $payloadDir }
          New-Item -ItemType Directory -Path $payloadDir -Force | Out-Null
          Compress-Archive -Path "$clientOutput/*" -DestinationPath (Join-Path $payloadDir "payload.zip") -Force
          $uninstallerExe = Join-Path (Join-Path "uninstaller" "out_v$ver") "BLFP-Uninstall.exe"
          if (-not (Test-Path $uninstallerExe)) { throw "uninstaller exe not found: $uninstallerExe" }
          Copy-Item -Path $uninstallerExe -Destination (Join-Path $payloadDir "BLFP-Uninstaller.exe") -Force

      - name: Build installer
        run: cd installer && npm run dist -- --publish never

      - name: Verify tuner is inside the client build
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.v }}"
          $tuner = Join-Path (Join-Path "build_v$ver" "win-unpacked") "resources\app\renderer\layout-tuner.js"
          if (-not (Test-Path $tuner)) { throw "布局调试器没有进客户端产物: $tuner" }
          Write-Host "OK - 布局调试器已在产物内"

      - name: Clear stale assets on reused tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=${{ steps.reltag.outputs.tag }}
          gh release view "$T" >/dev/null 2>&1 || exit 0
          for a in $(gh release view "$T" --json assets --jq '.assets[].name'); do
            [ -n "$a" ] && gh release delete-asset "$T" "$a" -y || true
          done

      - name: Publish debug release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: 调试构建（含布局调试器）v${{ steps.ver.outputs.v }}
          # 版本化(以 v 开头)标记为 prerelease，供测试渠道；debug-tuner 也标 prerelease
          prerelease: true
          files: installer/out_v${{ steps.ver.outputs.v }}-final/BLFP-Setup-v${{ steps.ver.outputs.v }}.exe
          body: |
            ## BLFP 调试构建 v${{ steps.ver.outputs.v }}

            本包**仅供开发调试**，含可视化布局调试器（比正式版多这个组件）。

            - 构建 commit：`${{ github.sha }}`
            - 布局调试器用法：Ctrl+Shift+D 打开面板
            - 设置页可选择「测试版」更新渠道自动拉取这类 pre-release

            > 正式发布版（release.yml）会在打包前用 rm + sed 剔除调试器，并 grep 断言必须找不到。