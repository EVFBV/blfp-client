<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>BLFP 安装程序</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="BLFP-Logo.svg" alt="BLFP" draggable="false">
      <div class="logo-text">
        <div class="app-name">BLFP</div>
        <div class="app-sub">我的世界联机助手</div>
      </div>
    </div>

    <div class="state" id="state-loading">
      <div class="spinner"></div>
      <div class="status" id="status-text">正在准备安装…</div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="percent" id="percent-text">0%</div>
      <div class="hint" id="hint-text">安装在：<span id="dir-text">--</span></div>
    </div>

    <div class="state hidden" id="state-done">
      <div class="tick">✓</div>
      <div class="status">安装完成，正在启动…</div>
    </div>

    <div class="state hidden" id="state-error">
      <div class="cross">!</div>
      <div class="status">安装失败</div>
      <div class="error" id="error-text"></div>
      <div class="actions">
        <button class="btn" id="btn-retry">重试</button>
        <button class="btn ghost" id="btn-quit">关闭</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
